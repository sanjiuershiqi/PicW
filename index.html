<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PicW - Modern Image Manager</title>
    <!-- Inject Editorial & Brutalist Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syne:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-primary: 'Syne', sans-serif;
        --font-mono: 'Space Mono', monospace;
      }
      body {
        font-family: var(--font-primary) !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #EAE6DF; /* Brutalist off-white/beige paper color */
        margin: 0;
        padding: 0;
        color: #111111;
      }
      * {
        font-family: var(--font-primary);
      }
      .font-mono {
        font-family: var(--font-mono) !important;
      }
      /* Hard transitions */
      body, .v-application {
        transition: background-color 0.1s ease, color 0.1s ease;
      }
    </style>
    <meta name="description" content="A site for uploading images to github" />
    <link rel="icon" type="image/png" sizes="16x16" href="/pwa/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/pwa/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon.png" />
    <link rel="mask-icon" href="/pwa/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="apple-mobile-web-app-title" content="PicW" />
    <meta name="application-name" content="PicW" />
    <meta name="msapplication-TileColor" content="#00aba9" />
    <meta name="theme-color" content="#ffffff" />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
